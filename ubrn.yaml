---
crate:
  repo: https://github.com/umarphaarook/matrix-rust-sdk
  rev: 6e00753245b01a046fefd6ac660e3b3df95aee58 # zaure-latest-event-edits: latest valid edit for the chat list and the timeline (#516), notification invite room check (#510), on becb768a5 (zaure-latest-event-encryption)
  manifestPath: bindings/matrix-sdk-ffi/Cargo.toml
android:
  cargoExtras: []
  directory: android
  native_bindings_dir: kotlin
  useSharedLibrary: true
  jniLibs: src/main/jniLibs
  targets:
    - arm64-v8a
    - armeabi-v7a
ios:
  cargoExtras: []
  directory: ios
  native_bindings_dir: swift
  targets:
    - aarch64-apple-ios
    - aarch64-apple-ios-sim
    - x86_64-apple-ios
  xcodebuildExtras: []
  frameworkName: build/RnMatrixRustSdk
noOverwrite:
  - "android/build.gradle"
turboModule:
  cpp: cpp
  ts: src
bindings:
  cpp: cpp/generated
  ts: src/generated
