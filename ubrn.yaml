---
crate:
  repo: https://github.com/umarphaarook/matrix-rust-sdk
  rev: 57fabed5be77d186ab25aa1bad51107c389aea86 # zaure-patches-7039-v2: unrecoverable-send wedge fix (#7039 cherry-pick), device trust lookups, legacy-session refusal from unsigned known devices; based on d298064
  manifestPath: bindings/matrix-sdk-ffi/Cargo.toml
android:
  cargoExtras: []
  directory: android
  native_bindings_dir: kotlin
  useSharedLibrary: true
  jniLibs: src/main/jniLibs
  targets:
    - arm64-v8a
    - armeabi-v7a
ios:
  cargoExtras: []
  directory: ios
  native_bindings_dir: swift
  targets:
    - aarch64-apple-ios
    - aarch64-apple-ios-sim
    - x86_64-apple-ios
  xcodebuildExtras: []
  frameworkName: build/RnMatrixRustSdk
noOverwrite:
  - "android/build.gradle"
turboModule:
  cpp: cpp
  ts: src
bindings:
  cpp: cpp/generated
  ts: src/generated
