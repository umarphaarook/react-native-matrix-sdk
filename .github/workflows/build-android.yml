name: Build (Android)
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel the previous run for the same ref when a new one starts, so a superseded
# commit does not keep a runner busy on an answer nobody wants.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TURBO_CACHE_DIR: .turbo/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate
        uses: ./.github/actions/generate
        with:
          platform: android
          release: false

      - name: Cache turborepo for Android
        uses: actions/cache@v4
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-android-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-android-

      # --filter scopes this to the bare example. Both examples define a
      # `build:android` script, and turbo matches tasks by script name across
      # every workspace, so without it the Expo example would be built here too -
      # before its native project has been prebuilt.
      - name: Check turborepo cache for Android
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:android --filter=@unomed/react-native-matrix-sdk-example --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:android').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Install JDK
        if: env.turbo_cache_hit != 1
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        if: env.turbo_cache_hit != 1
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Cache Gradle
        if: env.turbo_cache_hit != 1
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build example for Android
        env:
          JAVA_OPTS: "-XX:MaxHeapSize=6g"
        run: |
          yarn turbo run build:android --filter=@unomed/react-native-matrix-sdk-example --cache-dir="${{ env.TURBO_CACHE_DIR }}"

      # This needs an APK on disk, which a turbo cache hit does not produce. It
      # matters most here rather than on the Expo example: this one's
      # gradle.properties is hand-maintained, so `android.useLegacyPackaging` can
      # be lost in an edit. The Expo example generates it from app.json.
      - name: Check 16 KB page size readiness
        if: env.turbo_cache_hit != 1
        run: yarn example check:alignment

      # Everything below is the Expo example, which is what predicts whether a
      # real consuming app works: CNG-generated native config, and
      # expo-modules-autolinking rather than the community CLI. It reuses the
      # bindings the shared Generate step already produced, so it costs Gradle
      # time and no Rust time.
      #
      # A release build is the only thing that runs R8 over this package's
      # consumerProguardFiles. It costs a few minutes, and it earns them: the
      # rules shipped for `rustls-platform-verifier` exist because R8 deleted
      # those classes outright, which turned every HTTPS request into a
      # ClassNotFoundException at runtime while the build stayed green.
      - name: Build Expo example for Android (release, R8)
        if: env.turbo_cache_hit != 1
        env:
          JAVA_OPTS: "-XX:MaxHeapSize=6g"
        run: |
          yarn example-expo build:android:release
          yarn example-expo check:alignment:release
