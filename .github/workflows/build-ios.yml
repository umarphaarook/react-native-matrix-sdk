name: Build (iOS)
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# An iOS build here compiles React Native from source and takes around two hours,
# so a superseded commit is two hours of runner time spent on an answer nobody
# wants. Cancel the previous run for the same ref when a new one starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The two examples are built in separate jobs rather than one after the other in
  # a single job. They share no build products - each compiles its own React Native
  # - so running them in sequence only added the one to the other's wall clock, and
  # a failure in the second meant re-running the first to get back to it. The cost
  # is one duplicated `Generate` (about twenty minutes of Rust) per job.
  #
  # Neither job depends on the other, and neither is allowed to mask the other's
  # result: both have to be green to release.

  # Bare React Native: dynamic framework linkage, community-CLI autolinking,
  # checked-in native project. This is the "any consumer works" claim.
  bare:
    name: Bare example (debug, simulator)
    # React Native 0.86 requires Xcode >= 16.1, and macos-14 ships 15.4.
    runs-on: macos-15
    env:
      TURBO_CACHE_DIR: .turbo/ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate
        uses: ./.github/actions/generate
        with:
          platform: ios
          release: false

      - name: Cache turborepo for iOS
        uses: actions/cache@v4
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-ios-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-ios-

      # --filter scopes this to the bare example. Both examples define a
      # `build:ios` script, and turbo matches tasks by script name across every
      # workspace, so without it the Expo example would be built here too.
      - name: Check turborepo cache for iOS
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:ios --filter=@unomed/react-native-matrix-sdk-example --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:ios').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Cache cocoapods
        if: env.turbo_cache_hit != 1
        id: cocoapods-cache
        uses: actions/cache@v4
        with:
          path: |
            example/ios/Pods
          key: ${{ runner.os }}-cocoapods-bare-${{ hashFiles('example/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-bare-

      - name: Install cocoapods
        if: env.turbo_cache_hit != 1 && steps.cocoapods-cache.outputs.cache-hit != 'true'
        env:
          NO_FLIPPER: 1
        working-directory: example/ios
        run: |
          # Work around '[!] CocoaPods could not find compatible versions for pod "hermes-engine"'
          pod update hermes-engine --no-repo-update

          pod install

      - name: Build example for iOS
        run: |
          yarn turbo run build:ios --filter=@unomed/react-native-matrix-sdk-example --cache-dir="${{ env.TURBO_CACHE_DIR }}"

      # Needs a built .app on disk, which a turbo cache hit does not produce.
      - name: Check the iOS app is shippable
        if: env.turbo_cache_hit != 1
        run: yarn example check:ios

  # Expo CNG: static framework linkage, expo-modules-autolinking, React Native
  # built from source, native project generated by `expo prebuild`. This is the
  # "a real consuming app works" claim, and it carries the two builds no ordinary
  # development performs - a Release configuration, so the optimiser and the
  # linker's dead stripping actually run, and the xcframework's device slice
  # rather than its simulator slice. Unsigned, because linking is what is being
  # tested here, not provisioning.
  expo:
    name: Expo example (release, device slice)
    # React Native 0.86 requires Xcode >= 16.1, and macos-14 ships 15.4.
    runs-on: macos-15
    env:
      TURBO_CACHE_DIR: .turbo/ios-expo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate
        uses: ./.github/actions/generate
        with:
          platform: ios
          release: false

      - name: Cache turborepo for iOS
        uses: actions/cache@v4
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-ios-expo-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-ios-expo-

      # --filter is required even though only the Expo example defines
      # `build:ios:device`. It depends on the bare example as a workspace dependency,
      # so turbo pulls that into the task graph with a `<NONEXISTENT>` command - and
      # being first in the list, it is what `.find()` below would return. A
      # nonexistent command never caches, so the gate would report MISS forever and
      # the cache would be silently dead.
      - name: Check turborepo cache for iOS
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:ios:device --filter=@unomed/react-native-matrix-sdk-example-expo --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:ios:device').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Cache cocoapods
        if: env.turbo_cache_hit != 1
        id: cocoapods-cache
        uses: actions/cache@v4
        with:
          path: |
            example-expo/ios/Pods
          key: ${{ runner.os }}-cocoapods-expo-${{ hashFiles('example-expo/app.json', 'yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-expo-

      # No `pod update hermes-engine` workaround here: it needs an existing
      # Podfile.lock and this example has none, because its ios/ is `expo prebuild`
      # output that no checkout carries. `pod install` resolves from scratch.
      - name: Install cocoapods
        if: env.turbo_cache_hit != 1 && steps.cocoapods-cache.outputs.cache-hit != 'true'
        env:
          NO_FLIPPER: 1
        working-directory: example-expo/ios
        run: pod install

      - name: Build Expo example for iOS (release, device slice)
        run: |
          yarn turbo run build:ios:device --filter=@unomed/react-native-matrix-sdk-example-expo --cache-dir="${{ env.TURBO_CACHE_DIR }}"

      # Needs a built .app on disk, which a turbo cache hit does not produce.
      - name: Check the iOS app is shippable
        if: env.turbo_cache_hit != 1
        run: yarn example-expo check:ios:device
