pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }

// This package sets `codegenConfig.includesGeneratedCode`, so React Native's own
// `generateCodegenArtifactsFromSchema` task skips it and something else has to
// produce the TurboModule spec in `<package>/android/generated`.
//
// Do it here, at settings evaluation, so those sources exist before any project
// is configured. The obvious alternative - hanging it off `:app:preBuild` - is
// wrong in a way that only shows up with `org.gradle.parallel=true`: the
// generated sources belong to the *library* module, whose `compileDebugKotlin`
// is free to start before the app's `preBuild` runs. Because codegen deletes the
// directory before rewriting it, the library compile then snapshots a file list
// whose entries get unlinked underneath it, and Kotlin dies with an internal
// compiler error wrapping FileNotFoundException.
providers.exec {
  workingDir = rootDir.parentFile.parentFile
  commandLine "node", "node_modules/react-native-builder-bob/bin/bob", "build", "--target", "codegen"
}.standardOutput.asText.get()
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'unomed.reactnativematrixsdk.example'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
